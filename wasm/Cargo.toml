[package]
name = "soliditas-wasm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sable-link-preview = { git = "https://git.sable.moe/SableClient/link-preview.git", rev = "46c32b3872bf242721587f249679e37932de69b8", features = ["scrape"] }
serde_json = "1"
url = "2"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Headers", "ReadableStream", "RequestInit", "RequestRedirect", "Response"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
