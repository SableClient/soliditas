[package]
name = "soliditas"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "ws"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap", "quanta"] }
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "gzip"] }
sable-link-preview = { git = "https://git.sable.moe/SableClient/link-preview.git", rev = "bd282133151b69a42b4816887877496cdb84e106", features = ["reqwest"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
