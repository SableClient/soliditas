[package]
name = "soliditas"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
base64 = "0.23.1"
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "gzip"] }
sable-link-preview = { git = "https://git.sable.moe/SableClient/link-preview.git", rev = "c61eff7f44dacf8f519d2fa2e9bfe68d3686ddbb", features = ["reqwest"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
